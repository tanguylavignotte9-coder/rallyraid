name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # Syntaxe du launcher PowerShell : les runners GitHub ont pwsh
      # préinstallé (même sur Linux) — tout guillemet cassé par une
      # apostrophe française fait échouer la CI AVANT que le launcher
      # touche un PC Windows.
      - name: Syntaxe du launcher PowerShell
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path start.ps1), [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { Write-Error $_.Message }; exit 1 }
