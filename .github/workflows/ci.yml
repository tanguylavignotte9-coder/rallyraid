name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # Syntaxe du launcher PowerShell : les runners GitHub ont pwsh
      # préinstallé (même sur Linux) — tout guillemet cassé par une
      # apostrophe française fait échouer la CI AVANT que le launcher
      # touche un PC Windows.
      - name: Syntaxe du launcher PowerShell
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path start.ps1), [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { Write-Error $_.Message }; exit 1 }
      # PS 5.1 (Windows) lit un fichier sans BOM comme ANSI : tout octet
      # non-ASCII (tiret long, accent, guillemet courbe) casse le parsing.
      # pwsh 7 lit UTF-8 — le contrôle de syntaxe seul ne voit rien.
      - name: Launcher 100 pour cent ASCII (PS 5.1 lit sans BOM en ANSI)
        shell: pwsh
        run: |
          $bad = (Get-Content start.ps1 -Raw).ToCharArray() | Where-Object { [int]$_ -gt 127 }
          if ($bad) { Write-Error "start.ps1 contient des caracteres non ASCII (PS 5.1 les lit comme des guillemets courbes)"; exit 1 }
