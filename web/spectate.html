<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Rally Raid — vue 3D spectateur</title>
<style>
  :root { --bg:#10151c; --line:#232d3a; --txt:#dce3ec; --mut:#7c8794; --acc:#e63946; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; overflow:hidden; }
  body { background:var(--bg); font:13px/1.4 system-ui, sans-serif; }
  #scene { position:fixed; inset:0; }
  header { position:fixed; top:0; left:0; right:0; display:flex; align-items:center;
    gap:10px; padding:8px 12px; background:linear-gradient(#10151cee,#10151c00);
    z-index:10; flex-wrap:wrap; pointer-events:none; }
  header * { pointer-events:auto; }
  .clock { color:var(--txt); font-variant-numeric:tabular-nums; }
  .mut { color:var(--mut); }
  select, button { background:#171e27ee; color:var(--txt); border:1px solid var(--line);
    border-radius:6px; padding:6px 10px; font:inherit; }
  button { cursor:pointer; }
    padding:7px 11px; border-radius:6px; font-size:12px; color:var(--txt); }
  #err { position:fixed; inset:0; display:none; place-items:center; color:var(--mut); z-index:20; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="scene"></div>
<header>
  <b style="letter-spacing:.08em">RALLY RAID</b>
  <span class="clock" id="clock">—</span>
  <select id="carSel"></select>
  <button id="fsBtn">⛶ Plein écran</button>
  <button id="backBtn">← Poste de stratège</button>
</header>
<div id="err"><p>Chargement de three.js impossible — vérifiez la connexion internet (CDN).</p></div>
<script type="module" src="spectate.js"></script>
</body>
</html>
